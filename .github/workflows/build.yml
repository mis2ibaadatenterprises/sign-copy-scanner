name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret - building a DEBUG apk so you can test"
            echo "::warning::today. Debug builds carry a throwaway signature, so the next"
            echo "::warning::signed build will not install over it: uninstall first. Add the"
            echo "::warning::four secrets in README.md to get proper signed builds."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          KEYSTORE_PATH:     ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE:      ${{ github.run_number }}
          VERSION_NAME:      1.${{ github.run_number }}
        run: |
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk invoice-scanner.apk
          else
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk invoice-scanner.apk
          fi

      - name: Write version.json
        run: |
          cat > version.json <<JSON
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.${{ github.run_number }}",
            "apk": "https://github.com/${{ github.repository }}/releases/latest/download/invoice-scanner.apk"
          }
          JSON

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Invoice Scanner 1.${{ github.run_number }}${{ steps.key.outputs.signed == 'true' && '' || ' (debug build - unsigned key)' }}
          files: |
            invoice-scanner.apk
            version.json
